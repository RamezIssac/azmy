{% extends "allauth/layouts/base.html" %}
{% block body %}
<div class="page page-center" style="min-height:100vh; background:var(--tblr-body-bg)">
    <div class="container container-tight py-4">

        <div class="text-center mb-4">
            <a href="/" class="navbar-brand navbar-brand-autodark">
                <span class="fs-2 fw-bold text-primary">Bau Match</span>
            </a>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible mb-3" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="card card-md shadow-sm">
            <div class="card-body">
                {% block content %}{% endblock %}
            </div>
        </div>

        <div class="text-center text-secondary mt-3 small">
            &copy; {% now "Y" %} Bau Match. All rights reserved.
        </div>
    </div>
</div>
{% endblock body %}
{% block extra_body %}{% endblock %}
