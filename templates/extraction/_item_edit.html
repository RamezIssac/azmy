<form class="card" id="item-{{ item.pk }}" style="padding:.6rem .7rem; margin-bottom:.35rem; border-color:var(--accent)"
      hx-post="{% url 'extraction:item_edit' item.pk %}" hx-target="#item-{{ item.pk }}" hx-swap="outerHTML"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <div class="mono small" style="color:var(--accent); font-weight:700; margin-bottom:.35rem">{{ item.oz }}</div>
  <input type="text" name="short_text" value="{{ item.short_text }}" placeholder="Kurztext" style="margin-bottom:.35rem">
  <textarea name="long_text" rows="6" placeholder="Langtext" style="margin-bottom:.35rem">{{ item.long_text }}</textarea>
  <div style="display:grid; grid-template-columns:1fr 80px 1fr 90px auto auto; gap:.35rem">
    <input type="text" name="menge" value="{{ item.menge|default:'' }}" placeholder="Menge">
    <input type="text" name="einheit" value="{{ item.einheit }}" placeholder="ME">
    <input type="text" name="unit_price" value="{{ item.unit_price|default:'' }}" placeholder="EP">
    <input type="text" name="din276_group" value="{{ item.din276_group }}" placeholder="KG">
    <button class="btn sm primary">Speichern</button>
    <button type="button" class="btn sm" hx-get="{% url 'extraction:item_edit' item.pk %}?cancel=1" hx-target="#item-{{ item.pk }}" hx-swap="outerHTML">×</button>
  </div>
</form>
