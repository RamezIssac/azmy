<div style="margin-bottom:.5rem">
  <div style="background:#f4f4f5; border-radius:var(--r-sm); padding:.35rem .6rem; font-weight:600; font-size:.8rem">
    <span class="mono" style="color:var(--accent)">{{ section.number }}</span> {{ section.title }}
    <span class="muted" style="font-weight:400">({{ section.get_kind_display }})</span>
  </div>
  {% for item in section.items.all %}
    {% include "extraction/_item_row.html" with item=item %}
  {% endfor %}
  <div style="margin-left:.9rem">
    {% for child in section.children.all %}
      {% include "extraction/_section.html" with section=child %}
    {% endfor %}
  </div>
</div>
