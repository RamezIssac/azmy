{% extends "base.html" %}
{% block title %}Neues Projekt{% endblock %}
{% block content %}
<h1 style="font-size:1.25rem; margin-bottom:1rem">Neues Projekt</h1>
<form method="post" class="card" style="max-width:620px">
  {% csrf_token %}
  <label class="fl">Projektname *</label>
  <input type="text" name="name" required placeholder="Neubau von 6 MFH mit 160 Wohneinheiten, Franz-Mehring-Platz 6">
  <label class="fl">Adresse / Baustelle</label>
  <input type="text" name="address">
  <label class="fl">Bauherr / Auftraggeber</label>
  <input type="text" name="client_name">
  <label class="fl">Quelle (URL der Ausschreibung)</label>
  <input type="text" name="source_url" placeholder="https://www.berlin.de/ba-marzahn-hellersdorf/…">
  <div style="margin-top:1rem"><button class="btn primary">Anlegen &amp; Dokumente hochladen</button></div>
</form>
{% endblock %}
